<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Find My Hat — Pontianak Edition</title>
<style>
  /* Dark kampung-at-night vibe. Single file — no build tools. */
  :root {
    --bg: #0d0f14;
    --panel: #161a23;
    --grass: #1d2431;
    --grass2: #202839;
    --text: #d7dce6;
    --dim: #8a93a6;
    --danger: #ff5d5d;
    --win: #7dff9b;
    --accent: #b18cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    user-select: none;
  }
  h1 { font-size: 1.3rem; letter-spacing: 2px; margin-bottom: 4px; }
  h1 .ghost { color: var(--accent); }
  #hud {
    display: flex;
    gap: 18px;
    margin: 8px 0;
    font-size: 0.9rem;
    color: var(--dim);
  }
  #hud b { color: var(--text); }
  #board {
    display: grid;
    gap: 2px;
    background: var(--panel);
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(177, 140, 255, 0.08);
  }
  .cell {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 4px;
    background: var(--grass);
  }
  .cell.alt { background: var(--grass2); }
  .cell.hole { background: #05060a; }
  #status {
    margin-top: 12px;
    min-height: 24px;
    font-size: 0.95rem;
    text-align: center;
  }
  #status.danger { color: var(--danger); }
  #status.win { color: var(--win); }
  #status.spooky { color: var(--accent); font-style: italic; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2a3140;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 18px;
    cursor: pointer;
    margin-top: 10px;
  }
  button:active { background: #232a3a; }
  #restart { display: none; border-color: var(--accent); }
  /* D-pad for phone players; hidden on desktop. */
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 48px);
    gap: 6px;
    margin-top: 14px;
  }
  #dpad button { margin: 0; font-size: 1.2rem; padding: 0; }
  #dpad .up    { grid-column: 2; grid-row: 1; }
  #dpad .left  { grid-column: 1; grid-row: 2; }
  #dpad .down  { grid-column: 2; grid-row: 2; }
  #dpad .right { grid-column: 3; grid-row: 2; }
  #help { margin-top: 10px; font-size: 0.8rem; color: var(--dim); text-align: center; }
  @media (min-width: 700px) { #dpad { display: none; } }
  #footer { margin-top: 14px; font-size: 0.75rem; color: var(--dim); }
</style>
</head>
<body>

<h1>FIND MY HAT <span class="ghost">— PONTIANAK EDITION</span></h1>
<div id="hud">
  <span>Level <b id="level">1</b></span>
  <span>Hats found <b id="score">0</b></span>
</div>
<div id="board"></div>
<div id="status">Find your hat 🎩 before the Pontianak 👻 finds you...</div>
<button id="restart">Play again</button>
<div id="dpad">
  <button class="up">▲</button>
  <button class="left">◀</button>
  <button class="down">▼</button>
  <button class="right">▶</button>
</div>
<div id="help">Move: WASD / arrow keys. Holes 🕳️ kill you. The ghost floats over holes — you can't.</div>
<div id="footer">© 2026 Danial Zac</div>

<script>
// === GAME SETTINGS ===
const ROWS = 12;
const COLS = 12;
const BASE_HOLES = 0.14;       // level 1 starts with 14% holes
const HOLES_PER_LEVEL = 0.02;  // each level adds a few more holes
const MAX_HOLES = 0.28;        // cap so maps stay winnable

const SPRITES = { player: '🚶', hat: '🎩', ghost: '👻', hole: '🕳️' };

// Ghost speed: slow float (every 2nd turn) at L1-2, every turn at L3+.
function ghostMovesThisTurn(level, turn) {
  return level >= 3 || turn % 2 === 0;
}

// === GAME STATE ===
let state = null;
let msgTimer = null;

// === MAP GENERATION ===
function makeLevel(level) {
  const holeChance = Math.min(BASE_HOLES + (level - 1) * HOLES_PER_LEVEL, MAX_HOLES);

  // Keep regenerating until BFS confirms the hat is reachable — no impossible maps.
  while (true) {
    const holes = [];
    for (let r = 0; r < ROWS; r++) {
      holes.push([]);
      for (let c = 0; c < COLS; c++) {
        holes[r].push(Math.random() < holeChance);
      }
    }

    const player = { r: 0, c: 0 };
    holes[0][0] = false; // spawn must be safe

    // Hat spawns in the far quadrant — far from player, more challenge.
    const hat = {
      r: ROWS - 1 - Math.floor(Math.random() * Math.floor(ROWS / 3)),
      c: COLS - 1 - Math.floor(Math.random() * Math.floor(COLS / 3)),
    };
    holes[hat.r][hat.c] = false;

    // Ghost spawns at least 6 tiles away, so you get a head start.
    let ghost;
    do {
      ghost = { r: Math.floor(Math.random() * ROWS), c: Math.floor(Math.random() * COLS) };
    } while (dist(ghost, player) < 6 || (ghost.r === hat.r && ghost.c === hat.c));

    if (pathExists(holes, player, hat)) {
      return { holes, player, hat, ghost, level, turn: 0, over: false };
    }
    // no path to hat → discard, regenerate
  }
}

// Manhattan distance (taxicab, no diagonals).
function dist(a, b) {
  return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
}

// === BFS PATH CHECK ===
// Breadth-first flood from the player until it reaches the hat (or runs dry).
function pathExists(holes, from, to) {
  const seen = holes.map(row => row.map(() => false));
  const queue = [from];
  seen[from.r][from.c] = true;

  while (queue.length) {
    const cur = queue.shift();
    if (cur.r === to.r && cur.c === to.c) return true;

    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const r = cur.r + dr, c = cur.c + dc;
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
      if (seen[r][c] || holes[r][c]) continue;
      seen[r][c] = true;
      queue.push({ r, c });
    }
  }
  return false;
}

// === RENDERING ===
const boardEl = document.getElementById('board');
boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + ((r + c) % 2 ? ' alt' : ''); // checkerboard shading
      if (state.holes[r][c]) {
        cell.classList.add('hole');
        cell.textContent = SPRITES.hole;
      }
      if (state.hat.r === r && state.hat.c === c) cell.textContent = SPRITES.hat;
      if (state.ghost.r === r && state.ghost.c === c) cell.textContent = SPRITES.ghost;
      if (state.player.r === r && state.player.c === c) cell.textContent = SPRITES.player;
      boardEl.appendChild(cell);
    }
  }
  document.getElementById('level').textContent = state.level;
  document.getElementById('score').textContent = state.level - 1;
}

function say(msg, cls = '') {
  clearTimeout(msgTimer);
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

// === PLAYER MOVEMENT ===
function move(dr, dc) {
  if (state.over) return;

  const r = state.player.r + dr;
  const c = state.player.c + dc;

  // Walls block instead of killing — bump, don't die.
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) {
    say('You bump into the jungle edge. No way through.', 'spooky');
    return;
  }

  state.player = { r, c };
  state.turn++;

  // Order matters: a hole kills before the hat can save you.
  if (state.holes[r][c]) return gameOver('You fell into a hole! 🕳️');
  if (r === state.ghost.r && c === state.ghost.c) return gameOver('You walked INTO the Pontianak?! ...and died.');
  if (r === state.hat.r && c === state.hat.c) return win();

  // Your turn done → ghost's turn.
  if (ghostMovesThisTurn(state.level, state.turn)) moveGhost();

  render();
  spook();
}

// === GHOST AI ===
// Greedy chase: step along whichever axis (row or col) has the larger gap.
// The ghost floats over holes; the player cannot.
function moveGhost() {
  const g = state.ghost, p = state.player;
  const dr = p.r - g.r, dc = p.c - g.c;

  if (Math.abs(dr) >= Math.abs(dc)) {
    g.r += Math.sign(dr);
  } else {
    g.c += Math.sign(dc);
  }

  if (g.r === p.r && g.c === p.c) return gameOver('HEEHEHEEHEHE! The Pontianak caught you! 👻');
}

// Atmosphere messages — flavour only, no gameplay effect.
function spook() {
  if (state.over) return;
  const d = dist(state.ghost, state.player);
  if (d === 1) {
    say("A shriek freezes your blood — she's RIGHT BESIDE YOU!", 'danger');
  } else if (d <= 3) {
    say('You smell frangipani flowers... she is close. Run!', 'spooky');
  } else if (Math.random() < 0.15) {
    const lines = [
      'A distant scream echoes through the darkness...',
      "A woman's laugh drifts between the trees... HEEEEEE!",
      'Something rustles in the banana grove behind you.',
      'The night air suddenly turns cold.',
    ];
    say(lines[Math.floor(Math.random() * lines.length)], 'spooky');
  } else {
    say('');
  }
}

// === WIN / LOSE ===
function win() {
  // Win → next level. More holes, faster ghost.
  const next = state.level + 1;
  state = makeLevel(next);
  render();
  say(`You found your hat! 🎩 Level ${next} — the jungle gets darker...`, 'win');
  msgTimer = setTimeout(() => spook(), 2500);
}

function gameOver(msg) {
  state.over = true;
  render();
  say(msg + ` You survived to level ${state.level}.`, 'danger');
  document.getElementById('restart').style.display = 'inline-block';
}

function newGame() {
  state = makeLevel(1);
  document.getElementById('restart').style.display = 'none';
  render();
  say('Find your hat 🎩 before the Pontianak 👻 finds you...');
}

// === INPUT ===
const KEYS = {
  w: [-1, 0], arrowup: [-1, 0],
  s: [1, 0],  arrowdown: [1, 0],
  a: [0, -1], arrowleft: [0, -1],
  d: [0, 1],  arrowright: [0, 1],
};
document.addEventListener('keydown', (e) => {
  const dir = KEYS[e.key.toLowerCase()];
  if (dir) { e.preventDefault(); move(dir[0], dir[1]); }
  if (e.key.toLowerCase() === 'r' && state.over) newGame();
});

// D-pad for touch.
document.querySelector('#dpad .up').addEventListener('click', () => move(-1, 0));
document.querySelector('#dpad .down').addEventListener('click', () => move(1, 0));
document.querySelector('#dpad .left').addEventListener('click', () => move(0, -1));
document.querySelector('#dpad .right').addEventListener('click', () => move(0, 1));
document.getElementById('restart').addEventListener('click', newGame);

newGame();
</script>
</body>
</html>
