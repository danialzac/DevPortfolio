<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Find My Katana — Ronin Edition</title>
<style>
  /* * Cursed bamboo forest at night. Hitam + merah darah — samurai movie palette. */
  :root {
    --bg: #0a0908;
    --panel: #171310;
    --floor: #1e1914;
    --floor2: #241d16;
    --text: #e8ded0;
    --dim: #9a8d7c;
    --blood: #c1121f;
    --win: #e3b341;
    --accent: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: transparent; /* backdrop dilukis oleh #scene di belakang */
    color: var(--text);
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    user-select: none;
  }
  h1 { font-size: 1.3rem; letter-spacing: 3px; margin-bottom: 4px; }
  h1 .oni { color: var(--accent); }
  #hud {
    display: flex;
    gap: 18px;
    margin: 8px 0;
    font-size: 0.9rem;
    color: var(--dim);
  }
  #hud b { color: var(--text); }
  #hud .kills b { color: var(--blood); }
  #board {
    display: grid;
    gap: 2px;
    background: var(--panel);
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(193, 18, 31, 0.10);
    transition: box-shadow 0.15s;
  }
  /* * Bila slash oni, board menyala merah kejap. Gore tapi classy. */
  body.slash #board { box-shadow: 0 0 60px rgba(193, 18, 31, 0.55); }
  .cell {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 4px;
    background: var(--floor);
  }
  .cell.alt { background: var(--floor2); }
  .cell.pit { background: #030303; }
  .cell.blood { background: #2b0a0d; }
  #status {
    margin-top: 12px;
    min-height: 24px;
    font-size: 0.95rem;
    text-align: center;
  }
  #status.danger { color: var(--blood); }
  #status.win { color: var(--win); }
  #status.tense { color: var(--accent); font-style: italic; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #3a2e24;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 18px;
    cursor: pointer;
    margin-top: 10px;
  }
  button:active { background: #241d16; }
  #restart { display: none; border-color: var(--blood); }
  /* * D-pad untuk phone. Desktop guna keyboard. */
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 48px);
    gap: 6px;
    margin-top: 14px;
  }
  #dpad button { margin: 0; font-size: 1.2rem; padding: 0; }
  #dpad .up    { grid-column: 2; grid-row: 1; }
  #dpad .left  { grid-column: 1; grid-row: 2; }
  #dpad .down  { grid-column: 2; grid-row: 2; }
  #dpad .right { grid-column: 3; grid-row: 2; }
  #help { margin-top: 10px; font-size: 0.8rem; color: var(--dim); text-align: center; max-width: 460px; }
  @media (min-width: 700px) { #dpad { display: none; } }
  #footer { margin-top: 14px; font-size: 0.75rem; color: var(--dim); }

  /* * BACKDROP — hutan buluh + bulan darah, semua inline SVG/CSS.
     * Takde gambar luar: file kekal self-contained, takkan rosak bila hosting gambar mati. */
  #scene {
    position: fixed;
    inset: 0;
    z-index: -1; /* duduk BELAKANG semua content, tak kacau klik */
    overflow: hidden;
    background:
      radial-gradient(circle at 78% 10%, rgba(193, 18, 31, 0.14), transparent 42%),
      linear-gradient(#0a0908 0%, #0c0a07 55%, #140d08 100%);
  }
  #scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* * Kelopak sakura merah gugur — sikit je, subtle. Banyak sangat jadi pasar malam. */
  .petal {
    position: absolute;
    top: -5vh;
    width: 10px;
    height: 7px;
    background: #7e1220;
    border-radius: 80% 20% 80% 20%;
    opacity: 0.65;
    animation: petal-fall linear infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate(0, -5vh) rotate(0deg); }
    100% { transform: translate(-14vw, 108vh) rotate(560deg); }
  }
  @media (prefers-reduced-motion: reduce) { .petal { display: none; } }
</style>
</head>
<body>

<!-- * Backdrop scene: bulan darah + siluet buluh. Semua vector, zero request luar. -->

      <rect x="1084" y="160" width="26" height="5"/><rect x="1084" y="350" width="26" height="5"/><rect x="1084" y="540" width="26" height="5"/><rect x="1084" y="720" width="26" height="5"/>
      <rect x="1132" y="300" width="20" height="4"/><rect x="1132" y="500" width="20" height="4"/>
      <rect x="1168" y="220" width="18" height="4"/><rect x="1168" y="440" width="18" height="4"/><rect x="1168" y="660" width="18" height="4"/>
    </g>
    <!-- daun buluh kanan -->
    <g fill="#141008" opacity="0.85">
      <ellipse cx="1100" cy="110" rx="44" ry="9" transform="rotate(24 1100 110)"/>
      <ellipse cx="1050" cy="250" rx="38" ry="8" transform="rotate(-20 1050 250)"/>

    </g>

    <!-- kabus bawah: mist tipis atas tanah -->
    <defs>
      <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d7dce6" stop-opacity="0"/>

  <!-- kelopak gugur: masa & posisi lain-lain supaya nampak natural -->
  <span class="petal" style="left: 12%; animation-duration: 11s; animation-delay: 0s;"></span>
  <span class="petal" style="left: 28%; animation-duration: 15s; animation-delay: 4s;"></span>
  <span class="petal" style="left: 47%; animation-duration: 13s; animation-delay: 8s;"></span>
  <span class="petal" style="left: 63%; animation-duration: 16s; animation-delay: 2s;"></span>

  <span class="petal" style="left: 91%; animation-duration: 14s; animation-delay: 10s;"></span>
</div>

<h1>FIND MY KATANA <span class="oni">— RONIN EDITION</span></h1>
<div id="hud">
  <span>Level <b id="level">1</b></span>
  <span>Blades reclaimed <b id="score">0</b></span>
  <span class="kills">Oni slain <b id="kills">0</b></span>
</div>
<div id="board"></div>
<div id="status">A cursed forest stole your katana 🗡️. Take it back.</div>
<button id="restart">Walk the path again</button>
<div id="dpad">
  <button class="up">▲</button>
  <button class="left">◀</button>
  <button class="down">▼</button>
  <button class="right">▶</button>
</div>
<div id="help">Move: WASD / arrow keys. Pits ⚫ kill you. Walk INTO an oni 👹 to cut it down — but if it reaches YOU first, you die. Oni can't cross pits.</div>
<div id="footer">© 2026 Danial Zac</div>

<script>
//! === GAME SETTINGS ===
//* Sama engine macam Find My Hat, tapi sekarang kau ada pedang. Beza besar tu.
const ROWS = 12;
const COLS = 12;
const BASE_PITS = 0.12;      // level 1: 12% lubang jurang
const PITS_PER_LEVEL = 0.02; // naik level, tambah pit
const MAX_PITS = 0.26;       // cap supaya map tak jadi mustahil

const SPRITES = { player: '🥷', katana: '🗡️', oni: '👹', pit: '⚫', blood: '🩸' };

//? Berapa oni satu level? L1-2: satu. Lepas tu tambah, max 4.
//? Ramai musuh = lebih syok slash, tapi tak sampai stress.
function oniCount(level) {
  return Math.min(1 + Math.floor((level - 1) / 2), 4);
}

//? Oni speed: level 1-2 gerak selang satu turn (bagi masa fikir).
//? Level 3+ dia kejar SETIAP turn.
function oniMovesThisTurn(level, turn) {
  return level >= 3 || turn % 2 === 0;
}

//! === GAME STATE ===
let state = null;
let msgTimer = null;

//! === MAP GENERATION ===
function makeLevel(level) {
  const pitChance = Math.min(BASE_PITS + (level - 1) * PITS_PER_LEVEL, MAX_PITS);

  //? Regenerate sampai BFS confirm katana boleh sampai. Map mustahil = haram.
  while (true) {
    const pits = [];
    for (let r = 0; r < ROWS; r++) {
      pits.push([]);
      for (let c = 0; c < COLS; c++) {
        pits[r].push(Math.random() < pitChance);
      }
    }

    const player = { r: 0, c: 0 };
    pits[0][0] = false; // spawn mesti selamat

    //* Katana spawn kat sudut jauh — kena merentas hutan untuk ambil balik.
    const katana = {
      r: ROWS - 1 - Math.floor(Math.random() * Math.floor(ROWS / 3)),
      c: COLS - 1 - Math.floor(Math.random() * Math.floor(COLS / 3)),
    };
    pits[katana.r][katana.c] = false;

    //* Spawn oni: jauh dari player (≥6 tiles), bukan atas pit, bukan atas katana.
    const oni = [];
    for (let i = 0; i < oniCount(level); i++) {
      let o, tries = 0;
      do {
        o = { r: Math.floor(Math.random() * ROWS), c: Math.floor(Math.random() * COLS) };
        tries++;
      } while (tries < 200 && (
        dist(o, player) < 6 ||
        pits[o.r][o.c] ||
        (o.r === katana.r && o.c === katana.c) ||
        oni.some(x => x.r === o.r && x.c === o.c)
      ));
      oni.push(o);
    }

    if (pathExists(pits, player, katana)) {
      //* blood = Set of "r,c" strings — tanda tempat oni mati. Cosmetic je, tapi sedap mata.
      return { pits, player, katana, oni, blood: new Set(), level, turn: 0, over: false };
    }
  }
}

//* Manhattan distance — jalan macam teksi, tak boleh diagonal.
function dist(a, b) {
  return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
}

//! === BFS PATH CHECK ===
//* Flood-fill dari player. Kalau air sampai katana, map ni sah boleh menang.
function pathExists(pits, from, to) {
  const seen = pits.map(row => row.map(() => false));
  const queue = [from];
  seen[from.r][from.c] = true;

  while (queue.length) {
    const cur = queue.shift();
    if (cur.r === to.r && cur.c === to.c) return true;

    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const r = cur.r + dr, c = cur.c + dc;
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
      if (seen[r][c] || pits[r][c]) continue;
      seen[r][c] = true;
      queue.push({ r, c });
    }
  }
  return false;
}

//! === RENDERING ===
const boardEl = document.getElementById('board');
boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + ((r + c) % 2 ? ' alt' : '');

      if (state.pits[r][c]) {
        cell.classList.add('pit');
        cell.textContent = SPRITES.pit;
      } else if (state.blood.has(r + ',' + c)) {
        //* Darah kekal atas tile sampai habis level. Bukti pertempuran kau.
        cell.classList.add('blood');
        cell.textContent = SPRITES.blood;
      }
      if (state.katana.r === r && state.katana.c === c) cell.textContent = SPRITES.katana;
      for (const o of state.oni) {
        if (o.r === r && o.c === c) cell.textContent = SPRITES.oni;
      }
      if (state.player.r === r && state.player.c === c) cell.textContent = SPRITES.player;

      boardEl.appendChild(cell);
    }
  }
  document.getElementById('level').textContent = state.level;
  document.getElementById('score').textContent = state.level - 1;
  document.getElementById('kills').textContent = state.kills;
}

function say(msg, cls = '') {
  clearTimeout(msgTimer);
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

//* Red flash bila slash — board berkilau darah 150ms. Gore signal tanpa gambar seram.
function slashFlash() {
  document.body.classList.add('slash');
  setTimeout(() => document.body.classList.remove('slash'), 150);
}

//! === PLAYER MOVEMENT ===
function move(dr, dc) {
  if (state.over) return;

  const r = state.player.r + dr;
  const c = state.player.c + dc;

  // Dinding buluh — bump je, tak mati. Stress-free.
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) {
    say('The bamboo wall is too thick here. Tak boleh lalu.', 'tense');
    return;
  }

  //* SLASH CHECK dulu — kalau tile tu ada oni, kau tetak dia SEBELUM melangkah.
  //* Penyerang menang: kau jalan masuk = kau bunuh. Dia jalan masuk = kau mati.
  const target = state.oni.findIndex(o => o.r === r && o.c === c);
  if (target !== -1) {
    state.oni.splice(target, 1);        // buang oni dari game
    state.kills++;
    state.blood.add(r + ',' + c);       // tinggalkan darah atas tile
    slashFlash();
    state.player = { r, c };            // kau lintas mayat dia. Cinematic.
    state.turn++;
    moveAllOni();                       // oni lain masih bergerak — jangan leka
    render();
    if (state.over) return;
    const lines = [
      'One clean cut. The oni bursts into black mist and blood. 🩸',
      'Your blade sings. The oni falls before it can scream.',
      'Iaijutsu. Sarung balik pedang sebelum kepala dia jatuh.',
      'The bamboo drips red. You keep walking.',
    ];
    say(lines[Math.floor(Math.random() * lines.length)], 'danger');
    if (state.oni.length === 0) {
      msgTimer = setTimeout(() => say('The forest falls silent. Only the katana remains...', 'win'), 1800);
    }
    return;
  }

  state.player = { r, c };
  state.turn++;

  //* Pit bunuh dulu, katana selamatkan kemudian — urutan check penting.
  if (state.pits[r][c]) return gameOver('You fell into a bottomless pit. ⚫ The darkness keeps your bones.');
  if (r === state.katana.r && c === state.katana.c) return win();

  moveAllOni();
  if (state.over) return;

  render();
  tension();
}

//! === ONI AI ===
//* Setiap oni kejar player ikut greedy chase, TAPI oni tak boleh:
//* masuk pit (dia berat, bukan hantu), pijak katana, atau bertindih sesama oni.
//* Kalau laluan utama block, dia cuba paksi kedua. Dua-dua block? Dia tunggu. Seram jugak tu.
function moveAllOni() {
  if (!oniMovesThisTurn(state.level, state.turn)) return;

  for (const o of state.oni) {
    const p = state.player;
    const dr = p.r - o.r, dc = p.c - o.c;

    // paksi mana jurang lebih besar → itu langkah utama
    const primary   = Math.abs(dr) >= Math.abs(dc) ? [Math.sign(dr), 0] : [0, Math.sign(dc)];
    const secondary = Math.abs(dr) >= Math.abs(dc) ? [0, Math.sign(dc)] : [Math.sign(dr), 0];

    for (const [mr, mc] of [primary, secondary]) {
      if (mr === 0 && mc === 0) continue;
      const r = o.r + mr, c = o.c + mc;
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
      if (state.pits[r][c]) continue;
      if (r === state.katana.r && c === state.katana.c) continue;
      if (state.oni.some(x => x !== o && x.r === r && x.c === c)) continue;

      o.r = r; o.c = c;
      if (r === p.r && c === p.c) {
        return gameOver('An oni blade finds your back. 👹 Your blood joins the forest floor.');
      }
      break;
    }
  }
}

//* Tension messages — flavour je, tak ubah gameplay.
function tension() {
  if (state.over || state.oni.length === 0) return;
  const d = Math.min(...state.oni.map(o => dist(o, state.player)));
  if (d === 1) {
    say('STEEL RINGS — an oni is beside you! Strike first or die!', 'danger');
  } else if (d <= 3) {
    say('Heavy footsteps shake the bamboo... it has your scent.', 'tense');
  } else if (Math.random() < 0.15) {
    const lines = [
      'A war horn echoes across the valley...',
      'Somewhere in the dark, a blade is being sharpened.',
      'The wind carries the smell of iron and old blood.',
      'Crows scatter from the treetops. Ada benda datang.',
    ];
    say(lines[Math.floor(Math.random() * lines.length)], 'tense');
  } else {
    say('');
  }
}

//! === WIN / LOSE ===
function win() {
  //* Ambil katana → level baru. Kutukan tarik pedang tu jauh lagi. Klasik.
  const next = state.level + 1;
  const kills = state.kills;
  state = makeLevel(next);
  state.kills = kills; // kill count kekal sepanjang run — itu skor sebenar kau
  render();
  say(`Your katana returns to your hand 🗡️ ...then the curse drags it deeper. Level ${next}.`, 'win');
  msgTimer = setTimeout(() => tension(), 2500);
}

function gameOver(msg) {
  state.over = true;
  render();
  say(msg + ` You reached level ${state.level} with ${state.kills} oni slain.`, 'danger');
  document.getElementById('restart').style.display = 'inline-block';
}

function newGame() {
  state = makeLevel(1);
  state.kills = 0;
  document.getElementById('restart').style.display = 'none';
  render();
  say('A cursed forest stole your katana 🗡️. Take it back.');
}

//! === INPUT ===
const KEYS = {
  w: [-1, 0], arrowup: [-1, 0],
  s: [1, 0],  arrowdown: [1, 0],
  a: [0, -1], arrowleft: [0, -1],
  d: [0, 1],  arrowright: [0, 1],
};
document.addEventListener('keydown', (e) => {
  const dir = KEYS[e.key.toLowerCase()];
  if (dir) { e.preventDefault(); move(dir[0], dir[1]); }
  if (e.key.toLowerCase() === 'r' && state.over) newGame();
});

document.querySelector('#dpad .up').addEventListener('click', () => move(-1, 0));
document.querySelector('#dpad .down').addEventListener('click', () => move(1, 0));
document.querySelector('#dpad .left').addEventListener('click', () => move(0, -1));
document.querySelector('#dpad .right').addEventListener('click', () => move(0, 1));
document.getElementById('restart').addEventListener('click', newGame);

newGame();
</script>
</body>
</html>
