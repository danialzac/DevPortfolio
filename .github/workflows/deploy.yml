# ═══════════════════════════════════════════════════════════════════════
#  DEPLOY — the only automation you need.
#
#  Plain English: every time your portfolio is pushed to GitHub,
#  this file rebuilds your live website automatically. You do nothing.
#
#  Melayu: setiap kali portfolio ditolak ke GitHub, fail ini akan
#  bina semula laman web anda secara automatik. Anda tak buat apa-apa.
#
#  Your live site:  https://danialzac.github.io/DevPortfolio/
# ═══════════════════════════════════════════════════════════════════════

name: Deploy Portfolio

on:
  push:
    branches: [main]     # publish whenever main changes
  workflow_dispatch:     # ...or click "Run" manually in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull large media (videos/images)
        run: git lfs pull

      # Safety net: only blocks if index.html is truly broken (missing the
      # basic skeleton). Normal edits always pass. Keeps broken pages off your
      # live site in front of clients.
      - name: Quick sanity check
        run: |
          for tag in "<html" "<head" "<body" "</html>"; do
            if ! grep -qi "$tag" index.html; then
              echo "STOP: index.html is missing $tag — not publishing a broken page."
              exit 1
            fi
          done
          echo "OK: index.html looks healthy. Publishing."

      - name: Prepare Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub's Pages service sometimes answers "Deployment failed, try again
      # later" for no reason on our side. So we do exactly that — automatically.
      # Attempt 1 → wait 45s → attempt 2 → wait 90s → attempt 3.
      # Only if all three fail does the run go red.
      - name: Publish to the web
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Publish to the web (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 90

      - name: Publish to the web (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
